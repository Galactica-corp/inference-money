name: Setup toolchains
description: >
  Bun (+ frozen install) always; Foundry, halmos, Slither, the Aztec CLI and the Aztec node on request. Every
  version is read from toolchain.json. Callers check out the repo first.

inputs:
  foundry:
    description: Install Foundry at toolchain.json's pin.
    required: false
    default: "false"
  halmos:
    description: Install halmos at toolchain.json's pin (implies Python).
    required: false
    default: "false"
  slither:
    description: Install Slither at toolchain.json's pin (implies Foundry, whose build it reads).
    required: false
    default: "false"
  medusa:
    description: Medusa at toolchain.json's pin, with crytic-compile from the Slither lock (implies Foundry).
    required: false
    default: "false"
  aztec:
    description: Node, the pinned nargo release and contracts/aztec/toolchain (compile, TXE).
    required: false
    default: "false"
  aztec-node:
    description: Node and the pinned Aztec node + its Foundry for the local network (exports AZTEC_NODE_HOME).
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Read toolchain.json
      id: pins
      shell: bash
      run: |
        for key in bun cryticCompile foundry halmos medusa nargo node python slither; do
          echo "$key=$(jq -er --arg k "$key" '.[$k]' toolchain.json)" >> "$GITHUB_OUTPUT"
        done

    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ steps.pins.outputs.bun }}

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ steps.pins.outputs.bun }}-${{ hashFiles('bun.lock', 'contracts/aztec/toolchain/bun.lock', 'packages/local-network/toolchain/bun.lock') }}
        restore-keys: ${{ runner.os }}-bun-${{ steps.pins.outputs.bun }}-

    - shell: bash
      run: bun install --frozen-lockfile

    # A newer Foundry routes test-contract creation through a cheatcode halmos 0.3.3 lacks: bump both together.
    - if: inputs.foundry == 'true' || inputs.halmos == 'true' || inputs.slither == 'true' || inputs.medusa == 'true'
      uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
      with:
        version: v${{ steps.pins.outputs.foundry }}

    # The halmos, Slither and crytic-compile venvs install hash-locked wheels, which exist only for the CPython versions
    # their locks were resolved for: the runner image's own python3 moves with the image (ubuntu-26.04 ships one that
    # safe-pysha3 1.0.5 has no wheel for), so the venvs are built on toolchain.json's `python`.
    - if: inputs.halmos == 'true' || inputs.slither == 'true' || inputs.medusa == 'true'
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: ${{ steps.pins.outputs.python }}

    # The proof gate trusts halmos's output, so its whole tree installs from a hash lock, wheels only (an sdist build
    # would fetch unpinned build dependencies). A `halmos` bump without a matching halmos-<version>.requirements.txt
    # fails here. A venv, since the runner's system Python is externally managed (PEP 668); only `halmos` joins PATH.
    - if: inputs.halmos == 'true'
      shell: bash
      env:
        LOCK: ${{ github.action_path }}/halmos-${{ steps.pins.outputs.halmos }}.requirements.txt
      run: |
        python3 -m venv "$RUNNER_TEMP/halmos"
        "$RUNNER_TEMP/halmos/bin/pip" install --require-hashes --no-deps --only-binary :all: -r "$LOCK"
        mkdir -p "$RUNNER_TEMP/bin"
        ln -s "$RUNNER_TEMP/halmos/bin/halmos" "$RUNNER_TEMP/bin/halmos"
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

    # CI fails on any Slither finding, so Slither installs the same way: its whole tree from a hash lock, wheels only,
    # in a venv of its own, and only `slither` joins PATH.
    - if: inputs.slither == 'true'
      shell: bash
      env:
        LOCK: ${{ github.action_path }}/slither-${{ steps.pins.outputs.slither }}.requirements.txt
      run: |
        python3 -m venv "$RUNNER_TEMP/slither"
        "$RUNNER_TEMP/slither/bin/pip" install --require-hashes --no-deps --only-binary :all: -r "$LOCK"
        mkdir -p "$RUNNER_TEMP/bin"
        ln -s "$RUNNER_TEMP/slither/bin/slither" "$RUNNER_TEMP/bin/slither"
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

    # Medusa is the release binary, checked against its pin before extraction; its compile front end, crytic-compile,
    # comes from the Slither hash lock, which already pins it as a Slither dependency. A `medusa` bump without a matching
    # medusa-<version>.sha256, or a Slither lock whose crytic-compile is not `cryticCompile`, fails here.
    - if: inputs.medusa == 'true'
      shell: bash
      env:
        MEDUSA_VERSION: ${{ steps.pins.outputs.medusa }}
        CRYTIC_VERSION: ${{ steps.pins.outputs.cryticCompile }}
        PINS: ${{ github.action_path }}/medusa-${{ steps.pins.outputs.medusa }}.sha256
        LOCK: ${{ github.action_path }}/slither-${{ steps.pins.outputs.slither }}.requirements.txt
      run: |
        grep -qxF "crytic-compile==${CRYTIC_VERSION} \\" "$LOCK"
        dir="$RUNNER_TEMP/medusa"
        asset=medusa-linux-x64.tar.gz
        mkdir -p "$dir" "$RUNNER_TEMP/bin"
        curl -fsSL "https://github.com/crytic/medusa/releases/download/v${MEDUSA_VERSION}/$asset" -o "$dir/$asset"
        (cd "$dir" && grep -v '^#' "$PINS" | sha256sum -c -)
        tar -xzf "$dir/$asset" -C "$dir" medusa
        ln -s "$dir/medusa" "$RUNNER_TEMP/bin/medusa"
        python3 -m venv "$RUNNER_TEMP/crytic"
        "$RUNNER_TEMP/crytic/bin/pip" install --require-hashes --no-deps --only-binary :all: -r "$LOCK"
        ln -s "$RUNNER_TEMP/crytic/bin/crytic-compile" "$RUNNER_TEMP/bin/crytic-compile"
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

    # The aztec CLI, the TXE server and the node run on node.
    - if: inputs.aztec == 'true' || inputs.aztec-node == 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ steps.pins.outputs.node }}

    # No aztec-up installer: it runs unpinned remote scripts (noirup, foundryup) and an unlocked npm install. The JS
    # toolchain (aztec CLI, bb, TXE) comes from contracts/aztec/toolchain's frozen lockfile; nargo is the noir-lang
    # release, checked against its pin before extraction. A compiler that lies can make `compile.sh --check` agree with
    # any committed artifact, so a `nargo` bump without a matching nargo-<version>.sha256 fails here.
    - if: inputs.aztec == 'true'
      shell: bash
      env:
        NARGO_VERSION: ${{ steps.pins.outputs.nargo }}
        PINS: ${{ github.action_path }}/nargo-${{ steps.pins.outputs.nargo }}.sha256
      run: |
        dir="$RUNNER_TEMP/nargo"
        asset=noir-x86_64-unknown-linux-gnu.tar.gz
        mkdir -p "$dir"
        curl -fsSL "https://github.com/noir-lang/noir/releases/download/v${NARGO_VERSION}/$asset" -o "$dir/$asset"
        (cd "$dir" && grep -v '^#' "$PINS" | sha256sum -c -)
        tar -xzf "$dir/$asset" -C "$dir" ./nargo
        echo "NARGO=$dir/nargo" >> "$GITHUB_ENV"

    - if: inputs.aztec == 'true'
      shell: bash
      working-directory: contracts/aztec/toolchain
      run: bun install --frozen-lockfile

    # Same reasoning as above: no aztec-up. The script installs the node from a frozen lockfile and the Foundry
    # release it ships with against a pinned digest; the local network resolves both through AZTEC_NODE_HOME.
    - if: inputs.aztec-node == 'true'
      shell: bash
      run: |
        bash packages/local-network/scripts/install-node.sh "$RUNNER_TEMP/aztec-node"
        echo "AZTEC_NODE_HOME=$RUNNER_TEMP/aztec-node" >> "$GITHUB_ENV"
